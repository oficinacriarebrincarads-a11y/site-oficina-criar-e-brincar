<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina Aberta · Dia das Crianças e das Infâncias</title>
<meta name="description" content="Oficina Aberta: Dia das Crianças e das Infâncias na Escola Oficina Criar e Brincar. Sábado, 07/11, das 9h às 12h. Para crianças de 0 a 6 anos e suas famílias. Entrada gratuita, vagas limitadas.">
<meta name="theme-color" content="#8512DF">
<meta property="og:type" content="website">
<meta property="og:title" content="Oficina Aberta · Dia das Crianças e das Infâncias">
<meta property="og:description" content="Sábado, 07/11, das 9h às 12h. Para crianças de 0 a 6 anos e suas famílias. Entrada gratuita, vagas limitadas. Garanta sua vaga.">
<meta property="og:image" content="https://oficinacriarebrincar.com.br/assets/selo.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/selo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --roxo:#8512DF; --roxo-esc:#6A0EB3; --amarelo:#FCC218; --amarelo-esc:#E9AE00; --verde:#78B645; --verde-esc:#3F8A1F; --uva:#351B64;
    --floresta:#2F6227; --lilas:#E9D3F7; --lavanda:#F3EBFC; --lavanda-2:#E7D8FA; --sol:#FFF4D1; --linha:#E4D8F3; --cinza:#6B5E80; --erro:#C42E2E;
    --f-titulo:"Fredoka","Trebuchet MS",system-ui,sans-serif;
    --f-texto:"Nunito","Segoe UI",system-ui,sans-serif;
    --f-mao:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--lavanda);color:var(--uva);font-family:var(--f-texto);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
  button,input,textarea{font:inherit;color:inherit}
  .app{min-height:100%;display:flex;flex-direction:column}

  /* topo */
  .topo{position:sticky;top:0;z-index:5;background:var(--lavanda);padding:calc(12px + env(safe-area-inset-top,0px)) 20px 10px}
  .topo-in{max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:14px}
  .topo img{height:44px;width:44px;flex:none}
  .prog{flex:1;display:grid;gap:6px}
  .prog-barra{height:10px;background:#fff;border-radius:999px;overflow:hidden}
  .prog-barra i{display:block;height:100%;width:0;background:var(--roxo);border-radius:999px;transition:width .4s ease}
  .prog small{font:500 13px var(--f-titulo);color:var(--cinza);letter-spacing:.04em}
  .topo[data-oculto]{display:none}

  /* palco */
  main{flex:1;display:flex;padding:8px 20px calc(28px + env(safe-area-inset-bottom,0px))}
  .passo{width:100%;max-width:640px;margin:12px auto 0;animation:entra .35s ease both}
  .passo.volta{animation-name:entra-volta}
  @keyframes entra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes entra-volta{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.passo{animation:none}.prog-barra i{transition:none}}

  .num{font:600 15px var(--f-titulo);color:var(--roxo);display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .num svg{width:18px;height:18px}
  h1,h2{font-family:var(--f-titulo);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
  h2{font-size:clamp(26px,5.4vw,36px)}
  .ajuda{color:var(--cinza);margin:10px 0 0;font-size:17px}
  .campo{margin-top:26px}

  input[type=text],input[type=tel],textarea{width:100%;background:transparent;border:0;border-bottom:3px solid var(--lavanda-2);padding:10px 2px;font-size:clamp(22px,4.6vw,28px);font-family:var(--f-titulo);font-weight:500;color:var(--uva);border-radius:0;outline:none;transition:border-color .2s}
  textarea{font-size:20px;font-family:var(--f-texto);resize:none;min-height:96px;line-height:1.4}
  input::placeholder,textarea::placeholder{color:#B9A9D3}
  input:focus,textarea:focus{border-bottom-color:var(--roxo)}
  .campo.invalido input,.campo.invalido textarea{border-bottom-color:var(--erro)}

  .erro-msg{color:var(--erro);font-weight:700;font-size:16px;margin-top:10px;display:flex;align-items:center;gap:6px}
  .erro-msg[hidden]{display:none}

  /* ações */
  .acoes{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:28px}
  .btn{appearance:none;border:0;cursor:pointer;background:var(--amarelo);color:var(--uva);font:600 20px var(--f-titulo);padding:14px 26px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 0 var(--amarelo-esc);transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amarelo-esc)}
  .btn.roxo{background:var(--roxo);color:#fff;box-shadow:0 4px 0 var(--roxo-esc)}
  .btn.roxo:active{box-shadow:0 1px 0 var(--roxo-esc)}
  .btn[disabled]{opacity:.6;cursor:progress}
  .btn svg{width:20px;height:20px}
  .dica-enter{font-size:14px;color:var(--cinza)}
  .dica-enter b{font-weight:800}
  @media (hover:none){.dica-enter{display:none}}
  .link{appearance:none;background:none;border:0;padding:6px 2px;cursor:pointer;font:700 17px var(--f-texto);color:var(--roxo);text-decoration:underline;text-underline-offset:3px}
  :focus-visible{outline:3px solid var(--amarelo);outline-offset:3px;border-radius:8px}

  /* escolhas */
  .opcoes{display:grid;gap:12px;margin-top:26px;max-width:460px}
  .opcao{appearance:none;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;background:#fff;border:2.5px solid var(--lavanda-2);border-radius:16px;padding:14px 16px;font:600 20px var(--f-titulo);color:var(--uva);transition:border-color .15s,background .15s,transform .1s}
  .opcao:hover{border-color:var(--roxo)}
  .opcao:active{transform:scale(.99)}
  .opcao kbd{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--lavanda-2);border-radius:8px;font:600 14px var(--f-titulo);color:var(--roxo);background:#fff}
  .opcao[aria-pressed="true"],.opcao[aria-checked="true"]{border-color:var(--roxo);background:var(--lavanda)}
  .opcao[aria-pressed="true"] kbd,.opcao[aria-checked="true"] kbd{background:var(--roxo);border-color:var(--roxo);color:#fff}
  .opcao .tique{margin-left:auto;width:22px;height:22px;opacity:0;color:var(--roxo)}
  .opcao[aria-pressed="true"] .tique,.opcao[aria-checked="true"] .tique{opacity:1}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .chip{appearance:none;cursor:pointer;background:#fff;border:2.5px solid var(--lavanda-2);border-radius:999px;padding:10px 16px;font:600 17px var(--f-titulo);color:var(--uva);display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
  .chip:hover{border-color:var(--roxo)}
  .chip[aria-checked="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}
  .chip svg{width:16px;height:16px;display:none}
  .chip[aria-checked="true"] svg{display:block}

  /* crianças */
  .criancas{display:grid;gap:14px;margin-top:24px}
  .crianca{background:#fff;border-radius:18px;padding:16px 18px 18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px 18px;position:relative}
  .crianca label{font:600 14px var(--f-titulo);color:var(--cinza);letter-spacing:.03em;display:grid;gap:2px}
  .crianca input{font-size:22px}
  .crianca .idade{grid-column:1/-1;font-size:15px;font-weight:700;color:var(--verde-esc);min-height:22px}
  .crianca .idade.aviso{color:var(--cinza)}
  .crianca .tirar{position:absolute;top:8px;right:8px;appearance:none;border:0;background:none;cursor:pointer;color:var(--cinza);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
  .crianca .tirar:hover{background:var(--lavanda)}
  .crianca .tirar svg{width:18px;height:18px}
  .crianca.com-tirar label:first-child{padding-right:30px}
  .mais{justify-self:start;appearance:none;cursor:pointer;background:none;border:2.5px dashed var(--lavanda-2);border-radius:999px;padding:9px 16px;font:600 17px var(--f-titulo);color:var(--roxo);display:inline-flex;align-items:center;gap:8px}
  .mais:hover{border-color:var(--roxo)}
  .mais svg{width:18px;height:18px}

  /* contador */
  .contador{display:flex;align-items:center;gap:18px;margin-top:28px}
  .contador button{appearance:none;cursor:pointer;width:60px;height:60px;border-radius:50%;border:2.5px solid var(--lavanda-2);background:#fff;color:var(--roxo);display:grid;place-items:center}
  .contador button:hover{border-color:var(--roxo)}
  .contador button[disabled]{opacity:.35;cursor:default}
  .contador button svg{width:24px;height:24px}
  .contador output{font:600 64px/1 var(--f-titulo);color:var(--roxo);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
  .contador-legenda{font-weight:700;color:var(--cinza);margin-top:8px}

  /* boas-vindas */
  .capa{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
  .capa .logo-capa{justify-self:center;background:#fff;border-radius:20px;padding:14px 18px}
  .capa .logo-capa{display:grid;place-items:center}
  .capa .logo-capa img{display:block;width:min(100%,240px);height:auto}
  .capa .selo-evento{justify-self:start;display:inline-flex;align-items:center;gap:8px;background:var(--amarelo);color:var(--uva);font:600 14px var(--f-titulo);letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
  .capa h1{font-size:clamp(44px,10vw,72px);color:var(--roxo)}
  .capa h1 span{display:block;font-size:.4em;color:var(--uva);font-weight:500;margin-top:8px}
  .capa .texto{max-width:52ch}
  .infos{display:grid;gap:10px;background:#fff;border-radius:20px;padding:18px 20px}
  .info{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center}
  .info .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
  .info .ic svg{width:19px;height:19px}
  .info b{font-family:var(--f-titulo);font-weight:600;font-size:19px;display:block;line-height:1.2}
  .info span{font-size:15px;color:var(--cinza)}
  .retomar{background:var(--sol);border-radius:16px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-weight:700}

  /* fim */
  .fim{text-align:left;display:grid;gap:18px}
  .fim .casa{width:120px;height:auto}
  .fim .casa path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .fim .casa .t{stroke:var(--amarelo);stroke-width:8;stroke-dasharray:260;stroke-dashoffset:260;animation:desenha 1s .1s ease forwards}
  .fim .casa .p{stroke:var(--roxo);stroke-width:8;stroke-dasharray:80;stroke-dashoffset:80;animation:desenha .5s .9s ease forwards}
  .fim .casa .f{stroke:var(--verde);stroke-width:6;stroke-dasharray:90;stroke-dashoffset:90;animation:desenha .5s 1.2s ease forwards}
  @keyframes desenha{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.fim .casa path{animation:none;stroke-dashoffset:0}}
  .fim h2{font-size:clamp(32px,7vw,46px);color:var(--roxo)}
  .resumo{background:#fff;border-radius:20px;padding:6px 20px}
  .resumo div{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:12px;padding:12px 0;border-bottom:2px solid var(--lavanda)}
  .resumo div:last-child{border-bottom:0}
  .resumo dt{font:600 14px var(--f-titulo);color:var(--cinza);letter-spacing:.03em;margin:0}
  .resumo dd{margin:0;font-weight:700;word-break:break-word}
  .local-fim{display:grid;gap:12px;background:#fff;border-radius:20px;padding:16px 20px}
  .local-fim div{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start}
  .local-fim .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lavanda);color:var(--roxo)}
  .local-fim .ic svg{width:19px;height:19px}
  .local-fim p{margin:0;display:grid}
  .local-fim b{font:600 18px/1.25 var(--f-titulo)}
  .local-fim span{font-size:15px;color:var(--cinza)}
  .btn-pdf{justify-content:center;width:100%}
  .botoes-fim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .botoes-fim a{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fff;border:2.5px solid var(--lavanda-2);border-radius:16px;padding:14px 8px;text-decoration:none;color:var(--uva);font:600 15px var(--f-titulo)}
  .botoes-fim a:hover{border-color:var(--roxo)}
  .botoes-fim svg{width:26px;height:26px;color:var(--roxo)}


  /* capa no estilo do flyer */
  .titulo-evento{display:grid;gap:2px}
  .titulo-evento h1{font-size:clamp(48px,11vw,76px);color:var(--uva);line-height:1}
  .risco{width:min(100%,330px);height:16px;margin-top:-2px}
  .risco path{fill:none;stroke:var(--amarelo);stroke-width:7;stroke-linecap:round}
  .titulo-evento .sub{font:600 clamp(24px,5.4vw,32px)/1.15 var(--f-titulo);color:var(--floresta);margin:6px 0 0}
  .mao{font-family:var(--f-mao);font-weight:400}
  .balao{justify-self:start;background:var(--lilas);color:var(--uva);font-size:23px;line-height:1.25;padding:12px 18px;border-radius:6px 18px 8px 16px;max-width:30ch;margin:0}
  .destaque{font-family:var(--f-titulo);font-weight:600;color:var(--roxo);font-size:1.15em}
  .ativ h2{font-size:28px;color:var(--uva);margin:0 0 12px}
  /* cards das atividades: no celular, faixa que rola para o lado */
  .cards-ativ{list-style:none;margin:0 -20px;padding:2px 20px 8px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,44%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;scrollbar-width:none}
  .cards-ativ::-webkit-scrollbar{display:none}
  .card-ativ{scroll-snap-align:start;background:#fff;border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
  .card-ativ img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--lavanda-2)}
  .card-ativ div{padding:10px 12px 12px;display:grid;gap:2px;align-content:start}
  .card-ativ b{font:400 20px/1.1 var(--f-mao);color:var(--uva)}
  .card-ativ span{font-size:13px;font-weight:700;color:var(--cinza);line-height:1.3}
  .pontos{display:flex;justify-content:center;gap:8px;margin-top:6px}
  .pontos i{width:8px;height:8px;border-radius:999px;background:var(--lavanda-2);transition:width .2s,background .2s}
  .pontos i.on{width:22px;background:var(--roxo)}
  .card-ativ:nth-child(1) b{color:var(--floresta)}
  .card-ativ:nth-child(2) b,.card-ativ:nth-child(5) b{color:var(--roxo)}
  .ativ-mais{margin:14px 0 0;font-weight:700;color:var(--cinza)}
  .gratis{background:var(--uva);color:#fff;border-radius:20px;padding:16px 20px;display:grid;gap:4px}
  .gratis b{font:600 24px var(--f-titulo);color:var(--amarelo)}
  .gratis span{font-size:16px;color:#E6D8FA}
  .cta-capa{position:sticky;bottom:0;z-index:4;margin:0 -20px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--lavanda) 70%,rgba(243,235,252,0))}
  .assinatura{font-size:26px;color:var(--roxo);margin:0;justify-self:start}

  .rodape-frase{background:var(--floresta);color:#fff;text-align:center;font:400 22px/1.25 var(--f-mao);padding:14px 20px;margin:0}
  /* capa: no celular as colunas somem (display:contents) para o botão fixo funcionar na página toda */
  .col-a,.col-b{display:contents}
  .capa .logo-capa{order:-1}
  @media (min-width:980px){
    /* desktop: a capa cabe na altura da tela; tamanhos acompanham a altura (vh) */
    main:has(.passo[data-passo="capa"]){padding-block:clamp(10px,2vh,24px) clamp(10px,2vh,24px)}
    .passo[data-passo="capa"]{max-width:1120px;margin:auto}
    .capa{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);grid-template-areas:"a b";column-gap:56px;align-items:stretch}
    .col-b .logo-capa{order:0;padding:0 0 clamp(12px,2vh,20px);border-radius:0;border-bottom:2px solid var(--lavanda)}
    .col-b .logo-capa img{width:auto;height:clamp(76px,15vh,140px)}
    .col-a{grid-area:a;display:grid;gap:clamp(10px,2vh,22px);align-content:start}
    .col-b{grid-area:b;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(10px,1.8vh,16px);background:#fff;border-radius:24px;padding:clamp(16px,2.6vh,24px);box-shadow:0 2px 0 var(--lavanda-2)}
    .col-b .infos{padding:0;border-radius:0;background:none}
    .col-b .infos{gap:clamp(10px,2vh,18px)}
    .col-b .info b{font-size:clamp(17px,2.4vh,21px)}
    .col-b .gratis{padding:clamp(12px,2vh,16px) 20px}
    .col-b .gratis b{font-size:clamp(20px,2.8vh,24px)}
    .col-b .cta-capa{position:static;margin:0;padding:0;background:none;display:grid;gap:8px;justify-items:stretch}
    .col-b .cta-capa .btn{justify-content:center}
    .col-b .cta-capa .dica-enter{text-align:center;display:block}
    .assinatura{display:none}
    .titulo-evento h1{font-size:clamp(50px,10vh,88px)}
    .risco{height:clamp(10px,1.6vh,16px)}
    .titulo-evento .sub{font-size:clamp(20px,3.3vh,30px);margin-top:2px}
    .balao{font-size:clamp(18px,3vh,25px);padding:clamp(8px,1.3vh,12px) 18px;max-width:none}
    .capa .texto{font-size:clamp(16px,2.4vh,19px);margin:0}
    .ativ h2{font-size:clamp(22px,3.5vh,30px);margin-bottom:clamp(6px,1.2vh,12px)}
    /* 3 cards em cima e 2 embaixo, centralizados (grade de 6 colunas, cada card ocupa 2) */
    .cards-ativ{margin:0;padding:0;grid-auto-flow:row;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-columns:auto;gap:12px;overflow:visible}
    .card-ativ{grid-column:span 2}
    .card-ativ:nth-child(4){grid-column:2 / span 2}
    .card-ativ img{aspect-ratio:auto;height:clamp(66px,12.5vh,140px)}
    .card-ativ div{padding:6px 12px 8px}
    .card-ativ b{font-size:clamp(17px,2.5vh,21px)}

  /* comportamento por passo */
  function ligarCarrossel(){
    var lista = document.getElementById("cardsAtiv"), pts = document.querySelectorAll("#pontos i");
    if(!lista || !pts.length) return;
    lista.addEventListener("scroll", function(){
      var cards = lista.children, perto = 0, menor = Infinity;
      for(var i=0;i<cards.length;i++){ var d = Math.abs(cards[i].offsetLeft - lista.offsetLeft - 20 - lista.scrollLeft); if(d < menor){ menor = d; perto = i; } }
      if(lista.scrollLeft + lista.clientWidth >= lista.scrollWidth - 4) perto = cards.length - 1;
      pts.forEach(function(p, i){ p.classList.toggle("on", i === perto); });
    }, {passive:true});
  }
  function ligar(p){
    if(p === "capa") ligarCarrossel();
    var foco = palco.querySelector("input,textarea");
    if(foco && window.matchMedia("(hover:hover)").matches) foco.focus();
    else if(foco && p !== "criancas") setTimeout(function(){ try{ foco.focus({preventScroll:true}); }catch(e){} }, 60);

    if(p === "whats"){
      var w = document.getElementById("f-whats");
      w.addEventListener("input", function(){ w.value = mascaraTel(w.value); estado.whats = w.value; salvar(); limparErro(); });
    }
    if(p === "nome"){
      var n = document.getElementById("f-nome");
      n.addEventListener("input", function(){ estado.nome = n.value; salvar(); limparErro(); });
    }
    if(p === "escola"){
      var e = document.getElementById("f-escola");
      e.addEventListener("input", function(){ estado.escola = e.value; estado.semEscola = false; salvar(); });
    }
    if(p === "busca"){
      var t = document.getElementById("f-busca");
      t.addEventListener("input", function(){ estado.buscaTxt = t.value; salvar(); limparErro(); });
    }
    if(p === "criancas"){
      palco.querySelectorAll(".crianca").forEach(function(box){
        var i = +box.getAttribute("data-i");
        var nome = box.querySelector('[data-campo="nome"]'), nasc = box.querySelector('[data-campo="nasc"]');
        nome.addEventListener("input", function(){ estado.criancas[i].nome = nome.value; salvar(); limparErro(); });
        nasc.addEventListener("input", function(){
          nasc.value = mascaraData(nasc.value); estado.criancas[i].nasc = nasc.value; salvar(); limparErro(); mostrarIdade(box, i);
          if(nasc.value.length === 10 && parseData(nasc.value)){
            var prox = palco.querySelector('.crianca[data-i="' + (i+1) + '"] [data-campo="nome"]');
            if(prox && !prox.value) prox.focus();
          }
        });
        nome.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); ev.stopPropagation(); nasc.focus(); } });
        mostrarIdade(box, i);
      });
      var primeiro = palco.querySelector('[data-campo="nome"]');
      if(primeiro && !primeiro.value && window.matchMedia("(hover:hover)").matches) primeiro.focus();
    }
  }
  function mostrarIdade(box, i){
    var el = box.querySelector(".idade"), dt = parseData(estado.criancas[i].nasc);
    el.className = "idade"; el.textContent = "";
    if(!dt) return;
    var m = idade(dt);
    if(m < 0){ el.className = "idade aviso"; el.textContent = "Confira a data: ela está no futuro."; return; }
    if(m > 12*14){ el.className = "idade aviso"; el.textContent = "Confira o ano de nascimento."; return; }
    el.textContent = "No dia do evento: " + textoIdade(m);
    if(m >= 7*12){ el.className = "idade aviso"; el.textContent += ". O evento é pensado para crianças até 6 anos."; }
  }
  function limparErro(){

  /* validação */
  function validar(p){
    if(p === "nome"){
      if(estado.nome.trim().length < 2){ mostrarErro("Escreva seu nome para continuar."); return false; }
    }
    if(p === "whats"){
      var d = estado.whats.replace(/\D/g, "");
      if(d.length < 10){ mostrarErro("Digite o WhatsApp com DDD, por exemplo (11) 99999-9999."); return false; }
    }
    if(p === "criancas"){
      var validas = 0;
      for(var i=0;i<estado.criancas.length;i++){
        var c = estado.criancas[i], temNome = c.nome.trim().length > 0, temData = c.nasc.length > 0;
        if(!temNome && !temData) continue;
        if(!temNome){ mostrarErro("Falta o nome de uma das crianças."); return false; }
        var dt = parseData(c.nasc);
        if(!dt){ mostrarErro("Confira a data de nascimento de " + c.nome.trim().split(/\s+/)[0] + " (dd/mm/aaaa)."); return false; }
        var m = idade(dt);
        if(m < 0 || m > 12*14){ mostrarErro("Confira a data de nascimento de " + c.nome.trim().split(/\s+/)[0] + "."); return false; }
        validas++;
      }
      if(!validas){ mostrarErro("Conte pelo menos o nome e o nascimento de uma criança."); return false; }
      estado.criancas = estado.criancas.filter(function(c){ return c.nome.trim() || c.nasc; });
    }
    if(p === "busca"){
      if(!estado.busca.length && !estado.buscaTxt.trim()){ mostrarErro("Escolha pelo menos uma opção ou escreva com suas palavras."); return false; }
    }
    return true;
  }

  function okPasso(){
    var p = passosVisiveis()[atual].id;
    if(p === "capa"){ avancar(); return; }
    if(p === "comunidade" || p === "matricula"){
      if(!estado[p]){ mostrarErro("Escolha uma opção para continuar."); return; }
      avancar(); return;
    }
    if(p === "busca"){ enviar(); return; }
    if(!validar(p)) return;
    avancar();
  }

      var sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

      sc.onerror = falha;
      document.head.appendChild(sc);
    });
  }
  function imagemDataUrl(src){

  /* envio */
  var enviando = false;
  function enviar(){
    if(enviando) return;
    if(!validar("busca")) return;
    var btn = palco.querySelector('[data-acao="enviar"]');
    enviando = true; if(btn){ btn.disabled = true; btn.innerHTML = "Enviando..."; }
    var busca = estado.busca.join("; ");
    if(estado.buscaTxt.trim()) busca += (busca ? ". " : "") + estado.buscaTxt.trim();
    var dados = new URLSearchParams();
    dados.append(ENTRY.nome, estado.nome.trim());
    dados.append(ENTRY.criancas, textoCriancas());
    dados.append(ENTRY.comunidade, estado.comunidade);
    dados.append(ENTRY.escola, estado.comunidade === "Sim" ? "" : (estado.semEscola ? "Ainda não frequenta escola" : estado.escola.trim()));
    dados.append(ENTRY.matricula, estado.matricula);
    dados.append(ENTRY.busca, busca);
    dados.append(ENTRY.whats, estado.whats);
    dados.append(ENTRY.acomp, String(estado.acomp));
    // No computador (localhost) o envio é só simulado, para não criar respostas de teste na planilha
    enviarRemoto("concluído");
    (!ENVIAR_DE_VERDADE ? new Promise(function(r){ console.log("Envio simulado:", dados.toString()); setTimeout(r, 600); }) : fetch(FORM_URL, {method:"POST", mode:"no-cors", body:dados}))
      .then(function(){
        ga("generate_lead", {form_name: "oficina_aberta", acompanhantes: estado.acomp, matricula_2027: estado.matricula});
        estado.enviado = true; try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }catch(e){} enviando = false; irPara("fim");
      })
      .catch(function(){
        enviando = false;
        if(btn){ btn.disabled = false; btn.innerHTML = "Tentar de novo " + I.seta; }
        var e = document.getElementById("erro");
        e.innerHTML = 'Não conseguimos enviar. Confira sua internet e tente de novo. Se continuar, use o <a href="' + FORM_VIEW + '" target="_blank" rel="noopener">formulário do Google</a>.';
        e.hidden = false;
      });
  }

  /* eventos */
  palco.addEventListener("click", function(ev){
    var lk = ev.target.closest("[data-ga]"); if(lk) ga(lk.getAttribute("data-ga"), {form_name: "oficina_aberta"});
    var b = ev.target.closest("[data-acao]"); if(!b) return;
    var a = b.getAttribute("data-acao");
    if(a === "ok") okPasso();
    else if(a === "voltar") voltar();
    else if(a === "comecar"){ if(estado.enviado){ estado = novoEstado(); } ga("form_start", {form_name: "oficina_aberta"}); avancar(); }
    else if(a === "retomar") irPara(estado.passo);
    else if(a === "verfim") irPara("fim");
    else if(a === "escolha"){
      var campo = b.getAttribute("data-campo");
      estado[campo] = b.getAttribute("data-v"); salvar();
      palco.querySelectorAll('.opcao[data-campo="' + campo + '"]').forEach(function(o){ o.setAttribute("aria-checked", o === b ? "true" : "false"); });
      limparErro();
      setTimeout(avancar, 320);
    }
    else if(a === "semescola"){ estado.escola = ""; estado.semEscola = true; salvar(); avancar(); }
    else if(a === "addcrianca"){
      estado.criancas.push({nome:"", nasc:""}); salvar(); render();
      var ult = palco.querySelectorAll('[data-campo="nome"]'); ult[ult.length-1].focus();
    }
    else if(a === "tirar"){ estado.criancas.splice(+b.getAttribute("data-i"), 1); if(!estado.criancas.length) estado.criancas.push({nome:"",nasc:""}); salvar(); render(); }
    else if(a === "menos" || a === "maisum"){
      estado.acomp = Math.max(0, Math.min(15, estado.acomp + (a === "menos" ? -1 : 1))); estado.acompTocado = true; salvar();
      document.getElementById("f-acomp").textContent = estado.acomp;
      document.getElementById("acompLeg").textContent = legendaAcomp(estado.acomp);
      palco.querySelector('[data-acao="menos"]').disabled = estado.acomp <= 0;
      palco.querySelector('[data-acao="maisum"]').disabled = estado.acomp >= 15;
    }
    else if(a === "chip"){
      var v = b.getAttribute("data-v"), k = estado.busca.indexOf(v);
      if(k > -1) estado.busca.splice(k, 1); else estado.busca.push(v);
      b.setAttribute("aria-checked", k > -1 ? "false" : "true"); salvar(); limparErro();
    }
    else if(a === "enviar") enviar();
    else if(a === "pdf") gerarComprovante();
    else if(a === "nova"){ limpar(); estado = novoEstado(); ir(0, -1); }
  });

  document.addEventListener("keydown", function(ev){
    var p = passosVisiveis()[atual].id;
    if(ev.key === "Enter" && !ev.shiftKey){
      if(ev.target.tagName === "TEXTAREA") return;
      if(ev.target.tagName === "BUTTON" || ev.target.tagName === "A") return;
      if(p === "fim") return;
      ev.preventDefault(); okPasso(); return;
    }
    if((p === "comunidade" || p === "matricula") && !ev.metaKey && !ev.ctrlKey && /^[a-e]$/i.test(ev.key)){
      var ops = palco.querySelectorAll(".opcao"), idx = ev.key.toUpperCase().charCodeAt(0) - 65;
      if(ops[idx]) ops[idx].click();
    }
  });

  /* início */
  render();
})();
</script>
</body>
</html>
